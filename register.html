<!doctype html>
<html>
  <head>
    <title>Page Title</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    Create Username
    <input id="createusername" type="text" />
    Create Password
    <input id="createpassword" type="text" />
    Confirm Password
    <input id="confirmpassword" type="text" />
    <button type="button" onclick="document.location.href = 'Login.html';">Confirm</button>

    <script>
      const createusername = "qwer";
      const createpassword = "1234";
      const confirmpassword = "1234"

      const clickButton = (a, b, c) => {
        const postData = {
          createusername: a,
          createpassword: b,
          confirmpassword: c,
        };

        const data = {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(postData),
        };

        async function fetchData() {
          try {
            const response = await fetch(
              "http://127.0.0.1:8000/usersLogin",
              data,
            );
            console.log(response);
            if (response.data.status == "success") {
              document.location.href = "profile.html.html";
            } else {
              throw new Error("Failed to fetch data");
            }
          } catch (error) {
            console.error("Error:", error);
          }
        }



        fetchData();
      };
    </script>
  </body>
</html>
