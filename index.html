<!doctype html>
<html>
  <head>
    <title>Page Title</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    Name
    <input id="name" type="text" />
    Birthday
    <input id="types" type="text" />
    Number
    <input id="number" type="text" />
    Email
    <input id="email" type="text" />
    Nickname
    <input id="nickname" type="text" />
    Age
    <input id="age" type="text" />
    Religion
    <input id="religion" type="text" />
    Country
    <input id="country" type="text" />
    Year Level
    <input id="yearlevel" type="text" />
    Course
    <input id="course" type="text" />

    <button
      type="button"
      onclick="
        clickButton(
          document.getElementById('Name').value,
          document.getElementById('Types').value,
          document.getElementById('Number').value,
          document.getElementById('Email').value,
          document.getElementById('Nickname').value,
          document.getElementById('Age').value,
          document.getElementById('Religion').value,
          document.getElementById('Country').value,
          document.getElementById('YearLevel').value,
          document.getElementById('Course').value,
        )
      "
    >
      Click Me!
    </button>

    <script>
      const clickButton = (a, b, c, d, e, f, g, h, i, j) => {
        const postData = {
          Name: a,
          Types: b,
          Number: c,
          Email: e,
          Nickname: f,
          Age: g,
          Religion: h,
          YearLevel: i,
          Course: j,
        };

        const data = {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(postData),
        };

        async function fetchData() {
          try {
            const response = await fetch(
              "http://127.0.0.1:8000/usersLogin",
              data,
            );
            console.log(response);
            if (response.data.status == "success") {
              document.location.href = "profile.html.html";
            } else {
              throw new Error("Failed to fetch data");
            }
          } catch (error) {
            console.error("Error:", error);
          }
        }

        fetchData();
      };
    </script>
  </body>
</html>
